name: Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, such as v1.0.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: Validate and build release
    if: github.repository == 'Denizmerty/rigid-bodies' && github.actor == 'Denizmerty'
    runs-on: windows-2025
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Check out master and release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      # This gate uses no code from the requested tag until its ancestry is verified.
      - name: Verify release source
        id: source
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'Release tags must use vMAJOR.MINOR.PATCH without leading zeroes.'
          }
          $commit = git rev-parse --verify "refs/tags/$($env:RELEASE_TAG)^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'The release tag does not exist.' }
          git merge-base --is-ancestor $commit origin/master
          if ($LASTEXITCODE -ne 0) { throw 'The release commit must be on master.' }
          git checkout --detach $commit
          if ($LASTEXITCODE -ne 0) { throw 'Could not check out the release commit.' }
          ./scripts/version.ps1 -Tag $env:RELEASE_TAG
          "tag=$($env:RELEASE_TAG)" >> $env:GITHUB_OUTPUT
          "commit=$commit" >> $env:GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Build, test and package Windows x64
        env:
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
        run: ./scripts/release.ps1 -Jobs 4 -Tag $env:RELEASE_TAG

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: build/release/current/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-diagnostics
          path: |
            build/*.log
            build/*.json
            build/cmake/CMakeCache.txt
            build/cmake/CMakeFiles/CMakeConfigureLog.yaml
            build/cmake/Testing/Temporary/
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish tested installer
    needs: build
    runs-on: windows-2025
    timeout-minutes: 10
    concurrency:
      group: windows-release-publication
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      # This job never checks out or executes project code with its write token.
      - name: Download the tested release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release

      - name: Verify assets and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDirectory = (Resolve-Path -LiteralPath release).Path
          $version = $env:RELEASE_TAG.Substring(1)
          $baseName = "Rigid-Bodies-$version-windows-x64"
          $expected = @("$baseName-setup.exe", "$baseName.zip", "$baseName-build.json")
          $notesPath = Join-Path $releaseDirectory 'RELEASE-NOTES.md'
          $hasNotes = Test-Path -LiteralPath $notesPath -PathType Leaf
          if ($hasNotes) { $expected += 'RELEASE-NOTES.md' }
          $entries = @(Get-Content -LiteralPath release/SHA256SUMS)
          if ($entries.Count -ne $expected.Count) { throw 'Unexpected release manifest contents.' }
          $seen = @{}
          foreach ($entry in $entries) {
            if ($entry -cnotmatch '^([0-9a-f]{64})  ([A-Za-z0-9_.-]+)$') { throw 'Invalid checksum entry.' }
            $hash, $name = $Matches[1], $Matches[2]
            if ($name -cnotin $expected -or $seen.ContainsKey($name)) { throw "Unexpected release asset: $name" }
            $seen[$name] = $true
            if ((Get-FileHash -LiteralPath (Join-Path $releaseDirectory $name) -Algorithm SHA256).Hash.ToLowerInvariant() -cne $hash) {
              throw "Checksum mismatch: $name"
            }
          }
          $provenance = Get-Content -LiteralPath (Join-Path $releaseDirectory "$baseName-build.json") -Raw | ConvertFrom-Json
          if ($provenance.version -cne $version -or $provenance.commit -cne $env:RELEASE_COMMIT) {
            throw 'The assets were built from a different version or commit.'
          }
          $tagCommit = gh api "repos/$env:GH_REPO/commits/$env:RELEASE_TAG" --jq .sha
          if ($LASTEXITCODE -ne 0 -or $tagCommit -cne $env:RELEASE_COMMIT) { throw 'The remote release tag changed after the build.' }
          $releases = gh api --paginate "repos/$env:GH_REPO/releases" --jq ".[] | select(.tag_name == `"$env:RELEASE_TAG`") | .draft"
          if ($LASTEXITCODE -ne 0) { throw 'Could not read existing releases.' }
          $existing = @($releases)
          if ($existing.Count -gt 0 -and $existing[0] -cne 'true') { throw 'This release is already published; published assets are never replaced.' }
          if ($existing.Count -eq 0) {
            [string[]]$notesOptions = if ($hasNotes) { @('--notes-file', $notesPath) } else { @('--generate-notes') }
            gh release create $env:RELEASE_TAG --repo $env:GH_REPO --verify-tag --draft --title "Rigid Bodies $version" @notesOptions
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the release draft.' }
          } elseif ($hasNotes) {
            gh release edit $env:RELEASE_TAG --repo $env:GH_REPO --notes-file $notesPath
            if ($LASTEXITCODE -ne 0) { throw 'Could not update the release draft notes.' }
          }
          $assets = @($expected | ForEach-Object { Join-Path $releaseDirectory $_ }) + @(Join-Path $releaseDirectory 'SHA256SUMS')
          gh release upload $env:RELEASE_TAG @assets --repo $env:GH_REPO --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload the release assets.' }
          $publishedTags = gh api --paginate "repos/$env:GH_REPO/releases" --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name'
          if ($LASTEXITCODE -ne 0) { throw 'Could not check the latest published version.' }
          $makeLatest = 'true'
          foreach ($publishedTag in $publishedTags) {
            if ($publishedTag -cmatch '^v([0-9]+\.[0-9]+\.[0-9]+)$' -and [version]$Matches[1] -gt [version]$version) {
              $makeLatest = 'false'
            }
          }
          gh release edit $env:RELEASE_TAG --repo $env:GH_REPO --draft=false "--latest=$makeLatest"
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the completed release.' }
