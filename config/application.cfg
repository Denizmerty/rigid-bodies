# Rigid Bodies application configuration.
#
# Every key is optional. Missing keys use their built-in defaults. Unrecognised
# keys are reported at startup and skipped, so older configuration files still work.
#
config.version = 2

# A per-user copy of this file takes precedence over this one. It lives beside the
# other per-user settings: %APPDATA%\RigidBodies on Windows, ~/Library/Application
# Support/RigidBodies on macOS, and $XDG_CONFIG_HOME/rigid-bodies elsewhere.

window.title = Rigid Bodies
window.width = 1600
window.height = 900
window.resizable = true
window.start_maximised = false
window.vertical_sync = true
# On Windows the interface draws the window's title bar, with its own minimize,
# maximize and close buttons. Set this to false to keep the standard title bar.
window.custom_title_bar = true

# Simulation steps per second. Higher values can make contact-heavy scenes more
# stable, at the cost of more processing time.
simulation.steps_per_second = 120
# Each fixed step is divided into this many physics steps. The per-frame budget
# counts those smaller steps; excess elapsed time is dropped so input stays responsive.
# Both values accept 1 through 4096; substeps cannot exceed the budget.
simulation.substeps = 1
simulation.maximum_substeps_per_frame = 128
simulation.time_scale = 1.0
# Experiments open at t = 0 and wait for Play. Back to start also returns to t = 0.
simulation.start_paused = true

# Metres of world visible across the window height when a scenario is first framed.
simulation.default_view_height_m = 4.0
simulation.startup_scenario = free_fall

# Recognised backends are "overlay" and "rmlui". The document backend is present only
# in a build configured with RmlUi enabled; selecting it otherwise falls back to the
# overlay and says so in the log.
interface.backend = rmlui
# Values: workbench_dark, workbench_light, workbench_projector.
interface.theme = workbench_dark
interface.scale = 1.0
interface.reduce_motion = false
interface.units = si
interface.show_developer_overlay = false
interface.performance_overlay = false

controls.wheel_zoom_factor = 1.12
controls.pause_in_background = false

experiments.on_start = last
experiments.keep_lab_settings = true
experiments.recommended_view = true
experiments.ask_predictions = true

visualization.velocity_vectors = true
visualization.force_vectors = false
visualization.contact_points = true
visualization.center_of_mass = true
visualization.trajectories = false
visualization.bounding_boxes = false
visualization.grid = true
visualization.layers = bodies, outlines, labels, grid, velocity, contact_points
visualization.arrow_scope = all
visualization.arrow_length_automatic = false
visualization.scale.velocity = 24
visualization.scale.acceleration = 6
visualization.scale.force = 6
visualization.scale.momentum = 30
visualization.split_arrows = none
visualization.direction_deg = 0

effects.quality = standard
effects.material_shading = true
effects.contact_shadows = true
effects.depth_background = true
effects.motion_trails = true
effects.directional_blur = true
effects.impact_flashes = true
effects.impact_sparks = true
effects.impact_dust = true
effects.soft_deformation = true
effects.transitions = true
effects.limit.shading_body_budget = 128
effects.limit.contact_shadow_budget = 96
effects.limit.motion_body_budget = 64
effects.limit.directional_blur_budget = 64
effects.limit.impact_flash_budget = 32
effects.limit.spark_budget = 128
effects.limit.dust_budget = 64
effects.limit.deformation_budget = 32

capture.area = stage

# One of trace, info, warning, or error.
logging.level = info
